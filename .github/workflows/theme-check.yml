name: Theme Check

on:
  push:
    paths: ['theme/**']
  pull_request:
    paths: ['theme/**']

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Run Theme Check (fail on errors)
        run: shopify theme check --path theme --fail-level error
