<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150"><rect width="1600" height="1150" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3978D7"/></marker></defs><rect width="1600" height="150" fill="#071E41"/><rect x="0" y="0" width="8" height="150" fill="#C89B2C"/>
<text x="70" y="58" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#C89B2C" font-weight="700">CAPITAL ACCESS</text>
<text x="70" y="108" font-family="Georgia, 'Playfair Display', serif" font-size="40" fill="#FFFFFF" font-weight="700">The Capital Stack: Non-Dilutive to Dilutive</text>
<text x="70" y="138" font-family="Inter, Arial, sans-serif" font-size="19" fill="#B9CCE8">Start at the top. Only move down the stack when readiness and the business case justify it.</text><rect x="120" y="210" width="760" height="150" rx="12" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="150" y="262" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#071E41" font-weight="700" text-anchor="start">Grants + Competitions</text><text x="150" y="298" font-family="Inter, Arial, sans-serif" font-size="19" fill="#3978D7" font-weight="700" text-anchor="start">Non-dilutive · you keep 100% ownership</text><text x="150" y="330" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Free capital, but competitive and slow. Fit and eligibility first.</text><rect x="120" y="380" width="880" height="150" rx="12" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="150" y="432" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#071E41" font-weight="700" text-anchor="start">Revenue + Customers</text><text x="150" y="468" font-family="Inter, Arial, sans-serif" font-size="19" fill="#3978D7" font-weight="700" text-anchor="start">Non-dilutive · pre-sales, retainers, marketplaces</text><text x="150" y="500" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">The cheapest capital is a paying customer.</text><rect x="120" y="550" width="1000" height="150" rx="12" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="150" y="602" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#071E41" font-weight="700" text-anchor="start">Debt + Credit</text><text x="150" y="638" font-family="Inter, Arial, sans-serif" font-size="19" fill="#3978D7" font-weight="700" text-anchor="start">Non-dilutive · loans, LOCs, CDFIs, revenue-based financing</text><text x="150" y="670" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Costs interest, keeps equity. Requires cash-flow discipline.</text><rect x="120" y="720" width="1120" height="150" rx="12" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="150" y="772" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#071E41" font-weight="700" text-anchor="start">Programs + Partners</text><text x="150" y="808" font-family="Inter, Arial, sans-serif" font-size="19" fill="#3978D7" font-weight="700" text-anchor="start">Low-dilution · accelerators, strategic partners, purchase orders</text><text x="150" y="840" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Capital plus distribution, mentorship, or infrastructure.</text><rect x="120" y="890" width="1240" height="150" rx="12" fill="#0B2D57" stroke="#0B2D57" stroke-width="1.5"/><text x="150" y="942" font-family="Georgia, 'Playfair Display', serif" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">Equity Investors</text><text x="150" y="978" font-family="Inter, Arial, sans-serif" font-size="19" fill="#C89B2C" font-weight="700" text-anchor="start">Dilutive · angels, VCs, equity crowdfunding</text><text x="150" y="1010" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="400" text-anchor="start">Sell ownership last, at the strongest possible position.</text><line x1="1460" y1="240" x2="1460" y2="1010" stroke="#C89B2C" stroke-width="3"/><text x="1452" y="238" font-family="Inter, Arial, sans-serif" font-size="15" fill="#C89B2C" font-weight="700" text-anchor="end">KEEP MORE</text><text x="1478" y="620" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" transform="rotate(90 1478 620)">MORE DILUTION →</text><text x="120" y="1080" font-family="Inter, Arial, sans-serif" font-size="19" fill="#071E41" font-weight="600" text-anchor="start">Founder rule: readiness before capital — match the source to the job, and verify terms independently.</text><text x="70" y="1122" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">© 2026 Value Growth Partners · Founder Network member resource · Not for redistribution · Educational — not financial, legal, or investment advice</text></svg>