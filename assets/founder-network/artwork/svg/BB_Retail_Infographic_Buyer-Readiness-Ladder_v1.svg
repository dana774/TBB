<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150"><rect width="1600" height="1150" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3978D7"/></marker></defs><rect width="1600" height="150" fill="#071E41"/><rect x="0" y="0" width="8" height="150" fill="#C89B2C"/>
<text x="70" y="58" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#C89B2C" font-weight="700">RETAIL READINESS</text>
<text x="70" y="108" font-family="Georgia, 'Playfair Display', serif" font-size="40" fill="#FFFFFF" font-weight="700">The Buyer-Readiness Ladder</text>
<text x="70" y="138" font-family="Inter, Arial, sans-serif" font-size="19" fill="#B9CCE8">Buyers say yes to prepared brands. Climb in order — each rung de-risks the next.</text><rect x="120" y="880" width="600" height="120" rx="12" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="150" y="928" font-family="Georgia, 'Playfair Display', serif" font-size="25" fill="#071E41" font-weight="700" text-anchor="start">1 · Product Truth</text><text x="150" y="966" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Spec sheet, GTIN/barcodes, packaging, certifications, shelf life.</text><line x1="734" y1="940" x2="814" y2="808" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="230" y="744" width="600" height="120" rx="12" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="260" y="792" font-family="Georgia, 'Playfair Display', serif" font-size="25" fill="#071E41" font-weight="700" text-anchor="start">2 · Margin Math</text><text x="260" y="830" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Pricing calculator run: your cost, wholesale, retail — margin works at every tier.</text><line x1="844" y1="804" x2="924" y2="672" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="340" y="608" width="600" height="120" rx="12" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="370" y="656" font-family="Georgia, 'Playfair Display', serif" font-size="25" fill="#071E41" font-weight="700" text-anchor="start">3 · Proof of Velocity</text><text x="370" y="694" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">DTC, farmers market, or indie sales data a buyer can believe.</text><line x1="954" y1="668" x2="1034" y2="536" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="450" y="472" width="600" height="120" rx="12" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="480" y="520" font-family="Georgia, 'Playfair Display', serif" font-size="25" fill="#071E41" font-weight="700" text-anchor="start">4 · Buyer Materials</text><text x="480" y="558" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">One-page buyer brief, promo plan, and a tight sample kit.</text><line x1="1064" y1="532" x2="1144" y2="400" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="560" y="336" width="600" height="120" rx="12" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="590" y="384" font-family="Georgia, 'Playfair Display', serif" font-size="25" fill="#071E41" font-weight="700" text-anchor="start">5 · The Meeting</text><text x="590" y="422" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Targeted outreach, a rehearsed 15-minute story, and disciplined follow-up.</text><line x1="1174" y1="396" x2="1254" y2="264" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="670" y="200" width="600" height="120" rx="12" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="700" y="248" font-family="Georgia, 'Playfair Display', serif" font-size="25" fill="#071E41" font-weight="700" text-anchor="start">6 · The Trial</text><text x="700" y="286" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">A structured retail trial with support plan — then prove reorder velocity.</text><text x="120" y="1080" font-family="Inter, Arial, sans-serif" font-size="19" fill="#071E41" font-weight="600" text-anchor="start">Skip a rung and the ladder wobbles — each stage earns the buyer’s trust for the next.</text><text x="70" y="1122" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">© 2026 Value Growth Partners · Founder Network member resource · Not for redistribution · Educational — not financial, legal, or investment advice</text></svg>