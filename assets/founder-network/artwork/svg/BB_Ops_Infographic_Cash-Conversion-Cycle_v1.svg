<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><rect width="1600" height="1050" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3978D7"/></marker></defs><rect width="1600" height="150" fill="#071E41"/><rect x="0" y="0" width="8" height="150" fill="#C89B2C"/>
<text x="70" y="58" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#C89B2C" font-weight="700">OPERATIONS &amp; FORECASTING</text>
<text x="70" y="108" font-family="Georgia, 'Playfair Display', serif" font-size="40" fill="#FFFFFF" font-weight="700">The Cash-Conversion Cycle</text>
<text x="70" y="138" font-family="Inter, Arial, sans-serif" font-size="19" fill="#B9CCE8">Where product founders' cash hides — and the three levers that pull it back.</text><circle cx="560" cy="600" r="270" fill="none" stroke="#E5EAF2" stroke-width="42"/><path d="M 560 330 A 270 270 0 0 1 794 735" stroke="#3978D7" stroke-width="42" fill="none"/><path d="M 794 735 A 270 270 0 0 1 326 735" stroke="#C89B2C" stroke-width="42" fill="none"/><path d="M 326 735 A 270 270 0 0 1 560 330" stroke="#0B2D57" stroke-width="42" fill="none"/><text x="560" y="580" font-family="Georgia, 'Playfair Display', serif" font-size="42" fill="#071E41" font-weight="700" text-anchor="middle">CASH</text><text x="560" y="624" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4B5563" font-weight="600" text-anchor="middle">CONVERSION</text><text x="560" y="654" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4B5563" font-weight="600" text-anchor="middle">CYCLE</text><text x="560" y="280" font-family="Inter, Arial, sans-serif" font-size="21" fill="#0B2D57" font-weight="700" text-anchor="middle">CASH OUT: you pay suppliers</text><text x="940" y="610" font-family="Inter, Arial, sans-serif" font-size="21" fill="#3978D7" font-weight="700" text-anchor="start">INVENTORY sits (DIO)</text><text x="170" y="930" font-family="Inter, Arial, sans-serif" font-size="21" fill="#C89B2C" font-weight="700" text-anchor="end">RECEIVABLES wait (DSO)</text><rect x="1020" y="260" width="480" height="170" rx="14" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="1050" y="308" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#071E41" font-weight="700" text-anchor="start">Lever 1 · Shorten DIO</text><text x="1050" y="348" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Tighter forecasts, smaller runs, faster</text><text x="1050" y="378" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">turns. Your Forecast OS demand tab drives</text><text x="1050" y="408" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">this.</text><rect x="1020" y="455" width="480" height="170" rx="14" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="1050" y="503" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#071E41" font-weight="700" text-anchor="start">Lever 2 · Shorten DSO</text><text x="1050" y="543" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Invoice on delivery, offer early-pay terms,</text><text x="1050" y="573" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">chase receivables weekly.</text><rect x="1020" y="650" width="480" height="170" rx="14" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="1050" y="698" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#071E41" font-weight="700" text-anchor="start">Lever 3 · Lengthen DPO</text><text x="1050" y="738" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Negotiate supplier terms honestly — pay on</text><text x="1050" y="768" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">time, but not early.</text><text x="120" y="960" font-family="Inter, Arial, sans-serif" font-size="19" fill="#071E41" font-weight="600" text-anchor="start">Growth eats cash before it makes cash: every week trimmed from the cycle is interest-free working capital.</text><text x="70" y="1022" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">© 2026 Value Growth Partners · Founder Network member resource · Not for redistribution · Educational — not financial, legal, or investment advice</text></svg>