text-anchor="start">spray-and-pray.</text><rect x="1120" y="230" width="380" height="220" rx="14" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1.5"/><circle cx="1172" cy="286" r="26" fill="#3978D7"/><text x="1172" y="294" font-family="Inter, Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="1220" y="294" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#071E41" font-weight="700" text-anchor="start">First Touch</text><text x="1152" y="340" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Personalized opener from the email</text><text x="1152" y="370" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">flow. One clear, small ask.</text><rect x="1120" y="540" width="380" height="220" rx="14" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1.5"/><circle cx="1172" cy="596" r="26" fill="#3978D7"/><text x="1172" y="604" font-family="Inter, Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="1220" y="604" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#071E41" font-weight="700" text-anchor="start">Follow Up ×3</text><text x="1152" y="650" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Value-add follow-ups on a</text><text x="1152" y="680" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">schedule. Most yeses arrive after</text><text x="1152" y="710" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">touch two.</text><rect x="620" y="540" width="380" height="220" rx="14" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1.5"/><circle cx="672" cy="596" r="26" fill="#3978D7"/><text x="672" y="604" font-family="Inter, Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="720" y="604" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#071E41" font-weight="700" text-anchor="start">The Conversation</text><text x="652" y="650" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Discovery, not pitch. Log every</text><text x="652" y="680" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">outcome in the tracker.</text><rect x="120" y="540" width="380" height="220" rx="14" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1.5"/><circle cx="172" cy="596" r="26" fill="#C89B2C"/><text x="172" y="604" font-family="Inter, Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><text x="220" y="604" font-family="Georgia, 'Playfair Display', serif" font-size="24" fill="#071E41" font-weight="700" text-anchor="start">Review Weekly</text><text x="152" y="650" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Reply and meeting rates tell you</text><text x="152" y="680" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">what to fix: list, message, or</text><text x="152" y="710" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">offer.</text><line x1="510" y1="340" x2="610" y2="340" stroke="#3978D7" stroke-width="3" marker-end="url(#arr)"/><line x1="1010" y1="340" x2="1110" y2="340" stroke="#3978D7" stroke-width="3" marker-end="url(#arr)"/><line x1="1310" y1="460" x2="1310" y2="530" stroke="#3978D7" stroke-width="3" marker-end="url(#arr)"/><line x1="1110" y1="650" x2="1010" y2="650" stroke="#3978D7" stroke-width="3" marker-end="url(#arr)"/><line x1="610" y1="650" x2="510" y2="650" stroke="#3978D7" stroke-width="3" marker-end="url(#arr)"/><path d="M 310 530 C 310 460, 310 460, 310 460" stroke="#C89B2C" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="120" y="830" font-family="Inter, Arial, sans-serif" font-size="19" fill="#071E41" font-weight="600" text-anchor="start">The loop compounds: every cycle sharpens the list, the message, and the close rate. Consistency beats intensity.</text><text x="70" y="922" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">© 2026 Value Growth Partners · Founder Network member resource · Not for redistribution · Educational — not financial, legal, or investment advice</text></svg>