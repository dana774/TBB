<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3978D7"/></marker></defs><rect width="1600" height="150" fill="#071E41"/><rect x="0" y="0" width="8" height="150" fill="#C89B2C"/>
<text x="70" y="58" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#C89B2C" font-weight="700">PARTNER DIRECTORY</text>
<text x="70" y="108" font-family="Georgia, 'Playfair Display', serif" font-size="40" fill="#FFFFFF" font-weight="700">How Partner Routing Works</text>
<text x="70" y="138" font-family="Inter, Arial, sans-serif" font-size="19" fill="#B9CCE8">Research-based directory, honest disclosure, founder-controlled decisions.</text><rect x="120" y="260" width="250" height="300" rx="14" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="144" y="312" font-family="Georgia, 'Playfair Display', serif" font-size="21" fill="#071E41" font-weight="700" text-anchor="start">1 · Name the Need</text><text x="144" y="356" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">Define the job:</text><text x="144" y="384" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">manufacturing,</text><text x="144" y="412" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">packaging, 3PL,</text><text x="144" y="440" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">finance, creative,</text><text x="144" y="468" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">legal.</text><line x1="374" y1="410" x2="406" y2="410" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="410" y="260" width="250" height="300" rx="14" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="434" y="312" font-family="Georgia, 'Playfair Display', serif" font-size="21" fill="#071E41" font-weight="700" text-anchor="start">2 · Check Readiness</text><text x="434" y="356" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">Specs, volumes,</text><text x="434" y="384" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">budget, timeline</text><text x="434" y="412" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">documented —</text><text x="434" y="440" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">partners respond to</text><text x="434" y="468" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">prepared founders.</text><line x1="664" y1="410" x2="696" y2="410" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="700" y="260" width="250" height="300" rx="14" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="724" y="312" font-family="Georgia, 'Playfair Display', serif" font-size="21" fill="#071E41" font-weight="700" text-anchor="start">3 · Match Category</text><text x="724" y="356" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">Use the directory to</text><text x="724" y="384" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">shortlist 2–3</text><text x="724" y="412" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">candidates per</text><text x="724" y="440" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">category.</text><line x1="954" y1="410" x2="986" y2="410" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="990" y="260" width="250" height="300" rx="14" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="1014" y="312" font-family="Georgia, 'Playfair Display', serif" font-size="21" fill="#071E41" font-weight="700" text-anchor="start">4 · Disclosed Intro</text><text x="1014" y="356" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">Request a VGP</text><text x="1014" y="384" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">introduction where</text><text x="1014" y="412" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">offered. Any</text><text x="1014" y="440" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">referral fee is</text><text x="1014" y="468" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">disclosed up front.</text><line x1="1244" y1="410" x2="1276" y2="410" stroke="#C89B2C" stroke-width="3.5" marker-end="url(#arr)"/><rect x="1280" y="260" width="250" height="300" rx="14" fill="#EFF5FF" stroke="#E5EAF2" stroke-width="1.5"/><text x="1304" y="312" font-family="Georgia, 'Playfair Display', serif" font-size="21" fill="#071E41" font-weight="700" text-anchor="start">5 · You Decide</text><text x="1304" y="356" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">Evaluate</text><text x="1304" y="384" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">independently.</text><text x="1304" y="412" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">Listing ≠</text><text x="1304" y="440" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">endorsement; no</text><text x="1304" y="468" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">vendor is</text><text x="1304" y="496" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start">guaranteed.</text><rect x="120" y="620" width="1340" height="130" rx="14" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="150" y="668" font-family="Georgia, 'Playfair Display', serif" font-size="22" fill="#071E41" font-weight="700" text-anchor="start">Disclosure standard</text><text x="150" y="706" font-family="Inter, Arial, sans-serif" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start">Listings are compiled from public information. VGP may receive a referral fee from select partners — always disclosed before an introduction is made.</text><text x="70" y="872" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">© 2026 Value Growth Partners · Founder Network member resource · Not for redistribution · Educational — not financial, legal, or investment advice</text></svg>