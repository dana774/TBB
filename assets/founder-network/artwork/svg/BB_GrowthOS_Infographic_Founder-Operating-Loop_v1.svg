<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3978D7"/></marker></defs><rect width="1600" height="150" fill="#071E41"/><rect x="0" y="0" width="8" height="150" fill="#C89B2C"/>
<text x="70" y="58" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#C89B2C" font-weight="700">GROWTH OS &amp; AI</text>
<text x="70" y="108" font-family="Georgia, 'Playfair Display', serif" font-size="40" fill="#FFFFFF" font-weight="700">The Founder Operating Loop</text>
<text x="70" y="138" font-family="Inter, Arial, sans-serif" font-size="19" fill="#B9CCE8">Four systems, one weekly rhythm. AI assists every quadrant — a human approves every decision.</text><rect x="120" y="240" width="650" height="280" rx="16" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="160" y="302" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#071E41" font-weight="700" text-anchor="start">1 · Priorities</text><text x="160" y="352" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">One 90-day priority, three supporting goals.</text><text x="160" y="384" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">Everything else is noise.</text><rect x="830" y="240" width="650" height="280" rx="16" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="870" y="302" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#071E41" font-weight="700" text-anchor="start">2 · Dashboard</text><text x="870" y="352" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">A one-screen view of the numbers that decide your</text><text x="870" y="384" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">week.</text><rect x="830" y="560" width="650" height="280" rx="16" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="870" y="622" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#071E41" font-weight="700" text-anchor="start">3 · Cadence</text><text x="870" y="672" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">A weekly operating meeting with yourself: review,</text><text x="870" y="704" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">decide, assign.</text><rect x="120" y="560" width="650" height="280" rx="16" fill="#F5F8FC" stroke="#E5EAF2" stroke-width="1.5"/><text x="160" y="622" font-family="Georgia, 'Playfair Display', serif" font-size="28" fill="#071E41" font-weight="700" text-anchor="start">4 · Automation</text><text x="160" y="672" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">Automate the repeatable: intake, follow-ups,</text><text x="160" y="704" font-family="Inter, Arial, sans-serif" font-size="19" fill="#4B5563" font-weight="400" text-anchor="start">reporting, alerts.</text><circle cx="800" cy="540" r="86" fill="#071E41"/><text x="800" y="528" font-family="Inter, Arial, sans-serif" font-size="19" fill="#C89B2C" font-weight="700" text-anchor="middle">FOUNDER</text><text x="800" y="556" font-family="Inter, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">IN THE</text><text x="800" y="580" font-family="Inter, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">LOOP</text><line x1="780" y1="240" x2="810" y2="240" stroke="#C89B2C" stroke-width="4" marker-end="url(#arr)"/><line x1="1480" y1="530" x2="1480" y2="560" stroke="#C89B2C" stroke-width="4" marker-end="url(#arr)"/><line x1="820" y1="840" x2="790" y2="840" stroke="#C89B2C" stroke-width="4" marker-end="url(#arr)"/><line x1="120" y1="550" x2="120" y2="520" stroke="#C89B2C" stroke-width="4" marker-end="url(#arr)"/><text x="120" y="930" font-family="Inter, Arial, sans-serif" font-size="19" fill="#071E41" font-weight="600" text-anchor="start">AI rule of the house: AI drafts, organizes, and flags — the founder reviews and decides. No autonomous commitments, claims, or client-facing sends.</text><text x="70" y="972" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">© 2026 Value Growth Partners · Founder Network member resource · Not for redistribution · Educational — not financial, legal, or investment advice</text></svg>